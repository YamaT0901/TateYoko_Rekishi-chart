<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>タテヨコ歴史チャート</title>
<script>
(function(){
 var E = window.__tyErr = [];
 function rec(m){ try{ E.push(String(m).slice(0, 300)); if(E.length > 30) E.shift(); }catch(_){} }
 function stop(e){ try{ if(e.stopImmediatePropagation) e.stopImmediatePropagation(); e.preventDefault(); }catch(_){} }
 window.addEventListener('error', function(e){ if(e && e.target && e.target !== window && e.target.tagName) return; rec((e.message || 'error') + ' @' + (e.lineno || '?') + ':' + (e.colno || '?')); stop(e); return true; }, true);
 window.addEventListener('unhandledrejection', function(e){ rec('promise: ' + (e.reason && e.reason.message || e.reason)); stop(e); }, true);
 window.onerror = function(m, s, l, c){ rec(m + ' @' + l + ':' + c); return true; };
 try{ if(localStorage.getItem('tateyoko.skipIntro') === '1') document.documentElement.classList.add('intro-off'); }catch(e){}
})();
</script>
<style>
:root{
 --navy:#20293f;--paper:#f6f4ee;--teal:#2f7d6b;--shu:#c8553d;--gold:#c9a24a;
 --ink:#2a2f3a;--sub:#6b7280;--line:#ddd8cc;--card:#fffdf8;
 --colW:190px;--rowHeadW:118px;--fs:14px;
 --font:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","BIZ UDPGothic","Meiryo","Yu Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--paper);color:var(--ink);font-size:var(--fs);-webkit-text-size-adjust:100%;display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px}
rt{font-size:.55em;color:#6b6457;font-weight:normal}
ruby{ruby-position:over}
.hidden{display:none!important}

/* ---------- header ---------- */
#hdr{background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:6px 10px;flex:0 0 auto;box-shadow:0 2px 6px rgba(0,0,0,.18);z-index:30}
#logo{display:flex;align-items:center;gap:8px;white-space:nowrap}
#logo .mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--teal),#3e9a85);display:grid;place-items:center;position:relative;overflow:hidden}
#logo .mark i{position:absolute;background:#fff;border-radius:2px}
#logo .mark i.v{width:4px;height:22px;left:15px;top:6px;opacity:.95}
#logo .mark i.h{height:4px;width:22px;top:15px;left:6px;background:var(--gold)}
#logo b{font-size:18px;letter-spacing:.04em}
#logo small{display:block;font-size:10px;opacity:.75;font-weight:normal;letter-spacing:.02em}
#tabs{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
#tabs::-webkit-scrollbar{display:none}
#tabs button{background:transparent;border:0;color:#cfd6e6;padding:8px 10px;border-radius:9px;white-space:nowrap;font-size:14px;display:flex;align-items:center;gap:4px;min-height:40px}
#tabs button.on{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 0 -3px 0 var(--gold)}
#tabs button:hover{background:rgba(255,255,255,.08)}
@media(max-width:900px){#logo small{display:none}#tabs button .tl{display:none}#tabs button{padding:8px 11px;font-size:18px}}

main{flex:1 1 auto;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;flex-direction:column;min-height:0}
.view.on{display:flex}
.scrollv{overflow:auto;-webkit-overflow-scrolling:touch}
.pad{padding:14px 16px 40px}
.credit{font-size:11px;color:#8a8577;text-align:center;padding:4px}

/* ---------- toolbar ---------- */
.tbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:7px 10px;background:#efeadf;border-bottom:1px solid var(--line);flex:0 0 auto}
.seg{display:inline-flex;background:#fff;border:1px solid #cfc8b8;border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 11px;min-height:36px;font-size:14px;white-space:nowrap}
.seg button.on{background:var(--navy);color:#fff}
.tlabel{font-size:12px;color:var(--sub);white-space:nowrap}
.btn{border:1px solid #cfc8b8;background:#fff;border-radius:10px;padding:6px 12px;min-height:36px;font-size:14px;white-space:nowrap}
.btn:hover{background:#faf7f0}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.pri:hover{background:#286c5d}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.warn{background:#fff;border-color:#e2b0a6;color:#a8402c}
.btn.big{font-size:17px;padding:10px 20px;min-height:48px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:default}
.sbox{position:relative}
.sbox input{width:180px;padding:6px 10px 6px 30px;border:1px solid #cfc8b8;border-radius:10px;min-height:36px;font-size:16px}
.sbox::before{content:"🔎";position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.7}
.hitinfo{font-size:12px;color:var(--teal);font-weight:bold}
#personBanner{display:flex;align-items:center;gap:8px;background:#fff7e0;border-bottom:1px solid #ecd9a2;padding:5px 12px;font-size:14px}
@media(max-width:700px){.sbox input{width:130px}.tbar{gap:5px 6px;padding:6px}.seg button{padding:6px 8px}}

/* ---------- chart ---------- */
#chartWrap{flex:1 1 auto;overflow:auto;position:relative;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#chartGrid{display:grid;position:relative;width:max-content;min-width:100%;padding-bottom:30px}
.corner{position:sticky;left:0;top:0;z-index:12;background:var(--navy);color:#fff;font-size:11px;padding:6px 8px;display:flex;flex-direction:column;justify-content:center;gap:2px;border-right:2px solid #11172a}
.corner .ax{display:flex;align-items:center;gap:4px;white-space:nowrap}
.corner .ax b{color:var(--gold)}
.eh{position:sticky;top:0;z-index:10;background:var(--ec);color:#fff;border-right:1px solid rgba(255,255,255,.35);display:flex;align-items:stretch;min-height:56px}
.eh .ehb{flex:1;border:0;background:transparent;color:#fff;text-align:left;padding:5px 8px;display:flex;flex-direction:column;justify-content:center;gap:1px}
.eh .ehb .en{font-size:16px;font-weight:bold;display:flex;align-items:center;gap:5px;line-height:1.15}
.eh .ehb .el{font-size:10.5px;opacity:.9;line-height:1.25}
.eh .ehb .rd{font-size:10px;background:rgba(0,0,0,.2);border-radius:6px;padding:0 5px;align-self:flex-start;margin-top:2px}
.eh .ehz{border:0;background:rgba(0,0,0,.14);color:#fff;width:34px;font-size:15px}
.eh .ehz:hover,.eh .ehb:hover{background:rgba(0,0,0,.22)}
.rh{position:sticky;left:0;z-index:8;background:#f1ece1;border-right:2px solid #c9c1ae;border-bottom:1px solid var(--line);padding:8px 8px;display:flex;flex-direction:column;justify-content:flex-start;gap:4px;cursor:pointer}
.rh:hover{background:#ebe4d4}
.rh .rn{font-weight:bold;font-size:15px;line-height:1.2}
.rh .rs{font-size:10.5px;color:var(--sub);line-height:1.25}
.rh .rd{font-size:10.5px;color:#fff;background:var(--teal);border-radius:7px;padding:2px 6px;align-self:flex-start;margin-top:2px;white-space:nowrap}
.rh.wrow{background:#e6ebf1}
.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 6px 8px;background:var(--card);min-height:70px;transition:background .2s}
.cell.wrow{background:#f1f4f8}
.cell .sum{font-size:11.5px;color:#6a6556;line-height:1.45;margin-bottom:5px;padding-bottom:4px;border-bottom:1px dashed #e4ddcd}
.cell .sum.off{display:none}
.chips{display:flex;flex-direction:column;gap:4px}
.chip{display:flex;align-items:flex-start;gap:5px;text-align:left;border:1px solid #e3dccb;border-left:5px solid var(--tc);background:#fff;border-radius:8px;padding:4px 6px;font-size:13px;line-height:1.35;width:100%;transition:transform .12s,box-shadow .15s,opacity .2s}
.chip:hover{box-shadow:0 2px 6px rgba(0,0,0,.12)}
.chip .cy{font-size:10.5px;color:#7c7564;white-space:nowrap;padding-top:2px;min-width:2.6em}
.chip .cn{flex:1}
.chip.lv2{background:#fbfaf6;border-style:dashed;border-left-style:solid}
.chip.lv2 .cn::after{content:"発展";font-size:9px;color:#8a7a52;border:1px solid #d8cba5;border-radius:4px;padding:0 3px;margin-left:4px;vertical-align:1px;white-space:nowrap}
.chip .tag{font-size:9.5px;border-radius:4px;padding:0 4px;margin-right:3px;white-space:nowrap;vertical-align:1px}
.chip .tag.jp{background:#fde7e3;color:#a8402c;border:1px solid #f0c1b7}
.chip .tag.rg{background:#eef0f3;color:#55687a;border:1px solid #d6dbe2}
.chip.sel{box-shadow:0 0 0 3px var(--gold),0 3px 10px rgba(0,0,0,.2);transform:scale(1.02);z-index:3;position:relative}
.chip.linked{box-shadow:0 0 0 2px #e08a2a;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(224,138,42,.35)}}
.searching .chip:not(.hit){opacity:.25}
.chip.hit{box-shadow:0 0 0 2px var(--teal)}
.cell.colhl{background:#fff8e6}
.cell.rowhl{background:#eef8f4}
.cell.colhl.rowhl{background:#fff1c7}
.cell.empty .chips::after{content:"—";color:#c8c0ad;font-size:12px}
#linkSvg{position:absolute;left:0;top:0;pointer-events:none;z-index:4;overflow:visible}
#chartGrid.hlrow-mode .rh.rowsel{background:#d8efe6}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--sub);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:3px;vertical-align:-1px}

/* ---------- detail drawer ---------- */
#detail{position:fixed;right:0;top:0;bottom:0;width:400px;max-width:100%;background:#fffdf8;box-shadow:-6px 0 20px rgba(0,0,0,.2);z-index:60;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .28s ease}
#detail.open{transform:none}
#detail .dhead{flex:0 0 auto;background:var(--dc,#20293f);color:#fff;padding:10px 12px 10px 14px;display:flex;align-items:flex-start;gap:8px}
#detail .dhead .dt{flex:1}
#detail .dhead .dera{font-size:12px;opacity:.92}
#detail .dhead h2{margin:2px 0 0;font-size:20px;line-height:1.35}
#detail .dhead h2 rt{color:#ffffffcc}
.xbtn{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:10px;width:40px;height:40px;font-size:18px;flex:0 0 auto}
.xbtn.dark{background:#eee9dd;color:#333}
#detail .dbody{flex:1;overflow-y:auto;padding:12px 14px 40px;-webkit-overflow-scrolling:touch}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.badge{font-size:12px;border-radius:7px;padding:2px 8px;background:#eee9dd;color:#4a4537}
.badge.th{color:#fff}
.dyear{font-size:15px;font-weight:bold;color:var(--navy);margin-bottom:6px}
.ddesc{line-height:1.85;font-size:15px;margin:4px 0 12px}
.dsec{margin-top:14px;border-top:1px solid #ebe5d6;padding-top:10px}
.dsec h3{margin:0 0 7px;font-size:14px;display:flex;align-items:center;gap:6px;color:var(--navy)}
.dsec h3 .ax{font-size:11px;background:var(--navy);color:#fff;border-radius:6px;padding:1px 6px}
.dsec h3 .ax.y{background:var(--teal)}
.dsec h3 .ax.w{background:#c27317}
.mini{display:flex;gap:6px;align-items:flex-start;width:100%;text-align:left;border:1px solid #e6dfcf;background:#fff;border-radius:9px;padding:6px 8px;margin-bottom:5px;font-size:13.5px;line-height:1.4}
.mini:hover{background:#faf6ec}
.mini .mr{font-size:10.5px;color:#fff;border-radius:5px;padding:1px 5px;white-space:nowrap;margin-top:1px}
.mini .my{font-size:11px;color:var(--sub);white-space:nowrap;margin-top:2px}
.mini .mw{display:block;font-size:11.5px;color:#9a5a12;margin-top:2px}
.pchips{display:flex;flex-wrap:wrap;gap:5px}
.pchip{border:1px solid #d8cfba;background:#fff;border-radius:16px;padding:4px 10px;font-size:13.5px}
.pchip.p42::before{content:"⭐";font-size:10px;margin-right:2px}
.goroBox{background:#fff8e8;border:1px solid #eedbb0;border-radius:10px;padding:8px 10px}
.goroBox .gt{font-size:15px;line-height:1.6}
.goroBox textarea{width:100%;min-height:52px;border:1px solid #d9c99c;border-radius:8px;padding:6px;margin-top:6px}
.nowrap{white-space:nowrap}
.flowmini{display:flex;flex-direction:column;gap:4px}
.flowmini .fm{font-size:12.5px;background:#f2f7f5;border-radius:8px;padding:5px 8px;line-height:1.5}
.flowmini .fm b{color:var(--teal)}
.flowmini .fm.cur{background:#e0f0ea;border:1px solid #a7d3c3}
@media(max-width:700px){
 #detail{top:auto;height:72vh;height:72dvh;width:100%;border-radius:16px 16px 0 0;transform:translateY(105%)}
 #detail.open{transform:none}
}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(20,24,36,.5);z-index:80;display:none;align-items:center;justify-content:center;padding:12px}
.modal.open{display:flex}
.modal .box{background:#fffdf8;border-radius:16px;max-width:980px;width:100%;max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.35);overflow:hidden}
.modal .mhead{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;background:var(--mh,#20293f);color:#fff;flex:0 0 auto}
.modal .mhead h2{margin:0;font-size:18px;flex:1;line-height:1.35}
.modal .mbody{overflow:auto;padding:14px 16px 24px;-webkit-overflow-scrolling:touch;flex:1 1 auto}
.modal.small .box{max-width:520px}

/* row read (横に読む) */
.flow{display:flex;gap:0;overflow-x:auto;padding:4px 2px 12px;-webkit-overflow-scrolling:touch}
.fcard{flex:0 0 200px;background:#fff;border:1px solid #e3dccb;border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.fcard .fh{background:var(--ec);color:#fff;padding:6px 9px;font-weight:bold;font-size:14px}
.fcard .fh small{display:block;font-weight:normal;font-size:10px;opacity:.9}
.fcard .fs{padding:8px 9px;font-size:13px;line-height:1.6;flex:1}
.fcard .fe{padding:0 7px 8px;display:flex;flex-direction:column;gap:3px}
.fcard .fe button{font-size:12px;text-align:left;border:1px solid #ece5d4;background:#fbf9f3;border-radius:7px;padding:3px 6px;line-height:1.35}
.farrow{flex:0 0 26px;display:grid;place-items:center;color:var(--teal);font-size:20px;font-weight:bold}
/* era read (縦に読む) */
.vlist{display:flex;flex-direction:column;gap:0;border:1px solid #e3dccb;border-radius:12px;overflow:hidden}
.vrow{display:grid;grid-template-columns:120px 1fr;border-bottom:1px solid #eee7d6}
.vrow:last-child{border-bottom:0}
.vrow .vn{background:#f1ece1;padding:8px;font-weight:bold;font-size:14px}
.vrow.w .vn{background:#e6ebf1}
.vrow .vc{padding:8px 10px;background:#fff}
.vrow .vc .vs{font-size:13.5px;line-height:1.6}
.vrow .vc .ve{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.vrow .vc .ve button{font-size:12px;border:1px solid #e3dccb;background:#fbf9f3;border-radius:7px;padding:2px 7px}
.eradesc{background:#fff;border-left:5px solid var(--ec);padding:8px 12px;border-radius:8px;margin-bottom:10px;line-height:1.7}
@media(max-width:600px){.vrow{grid-template-columns:84px 1fr}.fcard{flex-basis:170px}}

/* ---------- zoom ---------- */
#zoomWrap{flex:1 1 auto;overflow:auto;position:relative;background:var(--card);-webkit-overflow-scrolling:touch;min-height:180px}
#zoomInner{position:relative}
.zhead{position:sticky;top:0;z-index:6;background:var(--card)}
.zband{position:absolute;top:0;height:28px;color:#fff;font-size:12px;font-weight:bold;display:flex;align-items:center;padding-left:6px;overflow:hidden;white-space:nowrap;border-right:1px solid #fff}
.zruler{position:absolute;top:28px;left:0;right:0;height:26px;background:#f1ece1;border-bottom:1px solid #d9d1bf;cursor:pointer}
.ztick{position:absolute;top:0;font-size:10.5px;color:#6b6457;padding-left:3px;border-left:1px solid #b9b09a;height:26px;white-space:nowrap;line-height:26px}
.zgrid{position:absolute;top:0;bottom:0;border-left:1px dashed #ebe4d4;pointer-events:none}
.zlane{position:absolute;left:0;border-bottom:1px solid #ebe4d4}
.zlane.w{background:rgba(85,104,122,.05)}
.zlh{position:sticky;left:0;z-index:5;width:110px;height:100%;background:#f1ece1;border-right:2px solid #c9c1ae;padding:6px 7px;font-weight:bold;font-size:13px;line-height:1.25}
.zlane.w .zlh{background:#e6ebf1}
.zev{position:absolute;height:24px;border:1px solid #ddd5c3;border-left:4px solid var(--tc);background:#fff;border-radius:6px;padding:0 6px 0 5px;font-size:12px;white-space:nowrap;display:flex;align-items:center;gap:4px;z-index:2}
.zev:hover{z-index:4;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.zev .zy{font-size:10px;color:#7c7564}
.zev.lv2{border-style:dashed;border-left-style:solid}
.zev.near{box-shadow:0 0 0 3px var(--gold);z-index:4}
.zdot{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--tc);border:2px solid #fff;box-shadow:0 0 0 1px var(--tc);z-index:3;pointer-events:none}
.zbar{position:absolute;height:5px;border-radius:3px;background:var(--tc);opacity:.45;z-index:1;pointer-events:none}
#zCursor{position:absolute;top:28px;bottom:0;width:0;border-left:3px solid var(--shu);z-index:7;pointer-events:none}
#zCursor .zcl{position:absolute;top:0;left:-1px;transform:translateX(-50%);background:var(--shu);color:#fff;font-size:12px;font-weight:bold;padding:3px 8px;border-radius:8px;white-space:nowrap;pointer-events:auto;cursor:ew-resize;touch-action:none}
#zNow{flex:0 0 auto;max-height:40%;overflow:auto;border-top:3px solid var(--shu);background:#fffaf2;padding:8px 12px}
#zNow h3{margin:0 0 6px;font-size:15px;color:var(--shu)}
#zNow .zr{display:grid;grid-template-columns:110px 1fr;gap:6px;padding:4px 0;border-bottom:1px dashed #eadfc9;font-size:13px;align-items:start}
#zNow .zr .zrn{font-weight:bold}
#zNow .zr .zrs{color:#6a6556;font-size:12px}
#zNow .zr button{font-size:12.5px;border:1px solid #e3dccb;background:#fff;border-radius:7px;padding:2px 7px;margin:2px 3px 0 0}
.zhint{font-size:12.5px;color:var(--sub)}

/* ---------- quiz ---------- */
.qwrap{max-width:860px;margin:0 auto}
.card{background:#fff;border:1px solid #e3dccb;border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:16px;color:var(--navy)}
.qtypes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.qtype{display:flex;gap:8px;align-items:flex-start;border:2px solid #e3dccb;border-radius:12px;padding:8px 10px;cursor:pointer;background:#fff}
.qtype input{width:20px;height:20px;margin-top:2px;flex:0 0 auto}
.qtype b{display:block;font-size:14.5px}
.qtype small{color:var(--sub);font-size:11.5px;line-height:1.4}
.qtype.on{border-color:var(--teal);background:#f1f8f5}
.formrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:6px 0}
.formrow select{padding:6px 8px;border-radius:9px;border:1px solid #cfc8b8;min-height:38px;background:#fff}
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.qprog{flex:1;height:10px;background:#e9e3d4;border-radius:6px;overflow:hidden}
.qprog i{display:block;height:100%;background:var(--teal);transition:width .3s}
.qbadge{font-size:12px;color:#fff;background:var(--navy);border-radius:7px;padding:3px 8px;white-space:nowrap}
.qprompt{font-size:19px;line-height:1.7;margin:6px 0 14px}
.qchoices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qc{border:2px solid #d9d1bf;background:#fff;border-radius:14px;padding:12px 14px;font-size:16.5px;text-align:left;line-height:1.5;min-height:58px;transition:transform .1s}
.qc:hover{background:#faf7ef}
.qc:active{transform:scale(.98)}
.qc.ok{border-color:#2f9d6b;background:#e5f6ee}
.qc.ng{border-color:#d0573f;background:#fdecea}
.qc.dim{opacity:.55}
.qfb{margin-top:12px;border-radius:12px;padding:10px 14px;line-height:1.7;font-size:15px}
.qfb.ok{background:#e5f6ee;border:1px solid #9fd8bd}
.qfb.ng{background:#fdecea;border:1px solid #f0b6aa}
.qfb .v{font-weight:bold;font-size:17px}

 try{ ctx = cv.getContext ? cv.getContext('2d') : null; }catch(e){ ctx = null; }
 var reduce = false; try{ reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }catch(e){}
 function size(){ if(!ctx) return; W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
 size(); window.addEventListener('resize', size);
 var pulses = [];
 function addPulse(){ var horiz = Math.random() < .5; pulses.push({ h: horiz, k: Math.floor(Math.random() * (horiz ? 9 : 17)), p: 0, sp: .25 + Math.random() * .25, col: horiz ? '#8fd6c2' : '#f0cf7e' }); }
 for(var i = 0; i < 4; i++) addPulse();
 function frame(now){
  if(!ctx || done) return;
  try{ drawFrame(now); }catch(e){ ctx = null; return; }
  raf = requestAnimationFrame(frame);
 }
 function drawFrame(now){
  var t = (now - t0) / 1000; ctx.clearRect(0, 0, W, H);
  var cols = 17, rows = 9, gx = W * 0.06, gy = H * 0.1, gw = W * 0.88, gh = H * 0.8;
  var prog = reduce ? 1 : Math.min(1, t / 1.6);
  ctx.lineWidth = 1;
  for(var r = 0; r <= rows; r++){ var y = gy + gh * r / rows; ctx.strokeStyle = 'rgba(143,214,194,.13)'; ctx.beginPath(); ctx.moveTo(gx, y); ctx.lineTo(gx + gw * Math.min(1, prog * 1.2 - r * 0.02), y); ctx.stroke(); }
  for(var c = 0; c <= cols; c++){ var x = gx + gw * c / cols; ctx.strokeStyle = 'rgba(240,207,126,.12)'; ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x, gy + gh * Math.min(1, prog * 1.2 - c * 0.015)); ctx.stroke(); }
  for(c = 0; c < cols; c++){ var x2 = gx + gw * (c + .5) / cols; ctx.fillStyle = ERAS[c].color; ctx.globalAlpha = .55 * prog; ctx.fillRect(x2 - gw / cols / 2 + 1, gy - 8, gw / cols - 2, 5); }
  ctx.globalAlpha = 1;
  if(prog >= 1 && !reduce){
   pulses.forEach(function(p){
    p.p += p.sp / 60;
    var len = p.h ? gw : gh, pos = p.p * len;
    var grad, x0, y0;
    if(p.h){ y0 = gy + gh * (p.k + .5) / rows; x0 = gx + pos; grad = ctx.createLinearGradient(x0 - 120, y0, x0, y0); }
    else { x0 = gx + gw * (p.k + .5) / cols; y0 = gy + pos; grad = ctx.createLinearGradient(x0, y0 - 90, x0, y0); }
    grad.addColorStop(0, 'rgba(255,255,255,0)'); grad.addColorStop(1, p.col);
    ctx.strokeStyle = grad; ctx.lineWidth = 3; ctx.beginPath();
    if(p.h){ ctx.moveTo(Math.max(gx, x0 - 120), y0); ctx.lineTo(x0, y0); } else { ctx.moveTo(x0, Math.max(gy, y0 - 90)); ctx.lineTo(x0, y0); }
    ctx.stroke(); ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(x0, y0, 3.5, 0, 7); ctx.fill();
   });
   pulses = pulses.filter(function(p){ return p.p < 1.05; });
   while(pulses.length < 5) addPulse();
  }
 }
 if(ctx) raf = requestAnimationFrame(frame);
 function finish(){
  if(done) return; done = true;
  try{ if($('#introSkip').checked) localStorage.setItem('tateyoko.skipIntro', '1'); }catch(e){}
  intro.classList.add('fade');
  setTimeout(function(){ intro.style.display = 'none'; cancelAnimationFrame(raf); window.removeEventListener('resize', size); requestAnimationFrame(drawLinks); }, 800);
  document.removeEventListener('keydown', key);
 }
 function key(ev){ if(ev.key === 'Enter' || ev.key === ' ' || ev.key === 'Escape'){ ev.preventDefault(); finish(); } }
 intro.addEventListener('click', function(ev){ if(ev.target.closest('#introSkipRow')) return; finish(); });
 document.addEventListener('keydown', key);
}

/* ================= 日本史／世界史の切りかえ ================= */
function clampRange(o){ if(o.to == null || o.to >= ERAS.length) o.to = ERAS.length - 1; if(o.from == null || o.from > o.to || o.from < 0) o.from = 0; return o; }
function onDatasetLoaded(){
 QS = clampRange(LS.get(dk('quizSet'), null) || defaultQS());
 PS = clampRange(LS.get(dk('printSet'), null) || defaultPS());
 Z.from = Z.to = ERA_IDX[DS.zoomDefault]; Z.cursor = null; Z.scale = 1;
 var zs = $('#zScale'); if(zs) zs.value = 1;
 var opts = ERAS.map(function(e, i){ return '<option value="' + i + '">' + e.icon + ' ' + esc(e.name) + '</option>'; }).join('');
 if($('#zFrom')){ $('#zFrom').innerHTML = opts; $('#zTo').innerHTML = opts; }
 GSEL = null; QZ = null; ANA = null; T.eraF = ''; T.rowF = '';
}
function switchDataset(k){
 if(k === DSK || !DSETS[k]) return;
 LS.set('dataset', k); closeDetail(); closeModal(); closePop();
 loadDataset(k); renderChart(); $('#chartWrap').scrollTo(0, 0);
 showView(CUR_VIEW);
 toast(DS.icon + ' ' + DS.label + 'にきりかえました');
}

/* ================= 操作の効果音 ================= */
document.addEventListener('click', function(ev){
 var el = ev.target.closest('button,.chip,.rh,.gitem.tap,label.qtype,select,a'); if(!el || el.disabled) return;
 if(el.classList.contains('sndBtn')){ setSound(!SND.on); return; }
 if(!SND.on) return;
 if(el.matches('.qc[data-ci]')) return; /* 正解・不正解の音が鳴る */
 if(el.closest('#tabs') || el.closest('#dsSw')) return sfx('tab');
 if(el.matches('#mClose,#dClose,.xbtn,#dlgNo,#popX,#qQuit')) return sfx('close');
 if(el.matches('#dlgYes')) return sfx(el.classList.contains('dng') ? 'warn' : 'select');
 if(el.matches('[data-gjump],[data-gochart],[data-zoomto],[data-zoomera],[data-zoom]')) return sfx('jump');
 if(el.matches('#gcCard,#gcFlip')) return sfx('flip');
 if(el.matches('#gcPrev,#gcNext,#gcShuf,#gcSort')) return sfx('pick');
 if(el.matches('.chip,.zev,.mini,[data-goto],[data-goto2],[data-gview],[data-person],.pc,.qc[data-oid],.pchip')) return sfx('select');
 if(el.matches('.ehb,.rh,#btnPerson,#gCards')) return sfx('open');
 if(el.closest('.seg') || el.matches('label.qtype')) return sfx('toggle');
 if(el.matches('#qStart,#qGoro,#qAna,#gQuiz,#qGoroWrong,#gWrongQuiz,#qGoroWrong2,#qAgain,#qRetry,#introStart')) return sfx('jump');
 sfx('tap');
}, true);
document.addEventListener('change', function(ev){ if(SND.on && ev.target.matches('select,input[type=checkbox],input[type=range]')) sfx('toggle'); }, true);

/* ================= イベントの受け口 ================= */
document.addEventListener('click', function(ev){
 var t = ev.target.closest('[data-gjump],[data-gview],[data-goto],[data-goto2],[data-eraread],[data-rowread],[data-zoom],[data-zoomto],[data-zoomera],[data-gochart],[data-person],[data-hlrow],[data-quizrow],[data-gedit],[data-gdel],[data-gsample],[data-gpick],[data-tedit],[data-tdel],[data-thide],[data-trevert],.chip,.ehb,.rh');
 if(!t) return;
 var d = t.dataset;
 if(t.closest('#anaGrid')) return;
 if(t.classList.contains('chip') && t.closest('#chartGrid')){ S.sel = d.id; applyHighlights(); openDetail(d.id); return; }
 if(t.classList.contains('ehb') && t.closest('#chartGrid')){ openEraRead(d.era); return; }
 if(t.classList.contains('rh') && t.closest('#chartGrid')){ openRowRead(t.dataset.row); return; }
 if(d.gjump){ GC.inCards = false; jumpToChart(d.gjump); return; }
 if(d.gview){ GC.inCards = !!t.closest('#gcBox'); openGoroInfo(d.gview); return; }
 if(d.goto){ closeModal(); if(CUR_VIEW === 'zoom'){ S.sel = d.goto; openDetail(d.goto); } else selectEvent(d.goto); return; }
 if(d.goto2){ S.sel = d.goto2; openDetail(d.goto2); return; }
 if(d.eraread){ openEraRead(d.eraread); return; }
 if(d.rowread){ openRowRead(d.rowread); return; }
 if(d.zoom){ zoomTo(d.zoom); return; }
 if(d.zoomera){ zoomTo(d.zoomera); return; }
 if(d.zoomto){ var e = BYID[d.zoomto]; zoomTo(e.era, e.yr); S.sel = e.id; openDetail(e.id); return; }
 if(d.gochart){ closeModal(); selectEvent(d.gochart); return; }
 if(d.person){ setPerson(d.person); return; }
 if(d.hlrow){ highlightRow(d.hlrow); return; }
 if(d.quizrow){ closeModal(); QS.types = ['yoko']; LS.set(dk('quizSet'), QS); showView('quiz'); startQuiz(); return; }
 if(d.gedit){ var gid = d.gedit; appPrompt('ごろをなおす', goroFor(gid), function(g){ setGoro(gid, g); renderGoro(); }); return; }
 if(d.gdel){ var did = d.gdel; appConfirm('このごろを消しますか？', function(){ setGoro(did, ''); renderGoro(); }, { yes: '消す', no: 'やめる', danger: true }); return; }
 if(d.gsample){ setGoro(d.gsample, sampleGoro(d.gsample)); toast('ノートに入れました'); if(t.closest('#modal')) closeModal(); renderGoro(); return; }
 if(d.gpick){ GSEL = d.gpick; $('#gPicked').innerHTML = '選んだできごと：<b>' + evName(BYID[GSEL]) + '</b>（' + esc(BYID[GSEL].yl) + '）'; $('#gSugg').classList.add('hidden'); $('#gSearch').value = ''; var s = sampleGoro(GSEL); if(s && !$('#gNew').value) $('#gNew').placeholder = 'れい：' + s; $('#gNew').focus(); return; }
 if(d.tedit){ editEvent(d.tedit); return; }
 if(d.tdel){ var tid = d.tdel; appConfirm('このできごとを削除しますか？', function(){ CUSTOM.add = CUSTOM.add.filter(function(x){ return x.id !== tid; }); saveCustom(); refreshAll(); renderTeacher(); }, { yes: '削除', no: 'やめる', danger: true }); return; }
 if(d.thide){ var i = CUSTOM.hidden.indexOf(d.thide); if(i >= 0) CUSTOM.hidden.splice(i, 1); else CUSTOM.hidden.push(d.thide); saveCustom(); refreshAll(); renderTeacher(); return; }
 if(d.trevert){ delete CUSTOM.edit[d.trevert]; saveCustom(); refreshAll(); renderTeacher(); return; }
});

/* ================= 起動 ================= */
function init(){
 loadDataset(DSK);
 $$('#dsSw button').forEach(function(b){ b.onclick = function(){ switchDataset(b.dataset.ds); }; });
 if(DIST && DIST.hideTeacher) $('#tabTeacher').classList.add('hidden');
 $$('#tabs button').forEach(function(b){ b.onclick = function(){ showView(b.dataset.v); }; });
 $$('#segMode button').forEach(function(b){ b.onclick = function(){ S.mode = b.dataset.m; saveSettings(); renderChart(); }; });
 $$('#segLv button').forEach(function(b){ b.onclick = function(){ S.lv = +b.dataset.l; saveSettings(); renderChart(); }; });
 $('#segOpt [data-o=furi]').onclick = function(){ S.furi = !S.furi; saveSettings(); renderChart(); if(S.sel && $('#detail').classList.contains('open')) openDetail(S.sel); };
 $('#segOpt [data-o=sum]').onclick = function(){ S.showSum = !S.showSum; saveSettings(); renderChart(); };
 $('#zoomIn').onclick = function(){ S.colW = Math.min(280, S.colW + 30); saveSettings(); renderChart(); };
 $('#zoomOut').onclick = function(){ S.colW = Math.max(130, S.colW - 30); saveSettings(); renderChart(); };
 var st; $('#search').oninput = function(){ var v = this.value; clearTimeout(st); st = setTimeout(function(){ S.search = v; applySearch(); }, 150); };
 $('#search').onkeydown = function(ev){ if(ev.key === 'Enter'){ var hits = $$('#chartGrid .chip.hit'); if(!hits.length) return; S._hi = ((S._hi || 0) + 1) % hits.length; scrollToChip(hits[S._hi].dataset.id); } };
 $('#btnPerson').onclick = openPersonPicker;
 $('#mClose').onclick = closeModal;
 $('#modal').addEventListener('click', function(ev){ if(ev.target.id === 'modal') closeModal(); });
 document.addEventListener('keydown', function(ev){ if(ev.key === 'Escape'){ if($('#dlg') && $('#dlg').classList.contains('open')) return; if($('#modal').classList.contains('open')) closeModal(); else closeDetail(); } });
 var rt; window.addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(function(){ drawLinks(); if(CUR_VIEW === 'zoom') renderZoom(); if(CUR_VIEW === 'print') buildPrint(); }, 200); });
 $$('.sndBtn').forEach(function(b){ b.textContent = SND.on ? '🔊' : '🔇'; });
 safeRun('zoomInit', zoomInit);
 safeRun('renderChart', renderChart);
 safeRun('initIntro', function(){ initIntro(); });
}
function safeRun(name, fn){ try{ return fn(); }catch(e){ try{ (window.__tyErr || []).push(name + ': ' + (e && e.message || e)); }catch(_){} } }
safeRun('init', init);

</script>
